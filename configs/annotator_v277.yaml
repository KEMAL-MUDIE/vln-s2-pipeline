# =============================================================================
# Annotator Config v277 — "Turn-Emphasis" style
# Corresponding eval result: SR=68.46% (343/501 eps) on val_unseen — #2 best
# Strategy: ChronoNav val_unseen (212 mods) + VLM-annotated seen/train
# =============================================================================
# v277 focus: emphasis on turn instructions (the 13 confirmed 3-run wins that
# moved from v272→v277 were all turn-direction improvements). The annotator
# config reflects this with a higher landmark diversity and balanced temperature.
# =============================================================================

version: "3.0-v277"

vllm:
  base_url: "http://10.77.32.231:8000/v1"
  model: "cyankiwi/gemma-4-31B-it-AWQ-4bit"
  api_key: "token-abc123"

gate3:
  max_tokens: 140
  # max_tokens=140: extra budget allows the VLM to describe DIRECTION more fully.
  # This is key for turn-emphasis — capturing "turn left at the second doorway"
  # rather than just "turn left".

  temperature: 0.45
  # temperature (v277 = 0.45 — balanced/diverse):
  # Between v272 (0.4) and v264 (0.6). Produces richer landmark vocabulary
  # without sacrificing coherence. Better at distinguishing similar scenes.
  # EFFECT: more varied room/landmark names → more distinctive instructions.
  # CHANGE IF: too many hallucinated landmarks → lower to 0.35.

gate4:
  max_tokens: 130
  temperature: 0.45
  # temperature=0.45: produces more naturally varied phrasing than 0.4.
  # EFFECT: turn language varies between "turn left", "make a left", "go left at".
  # TRADEOFF: slightly less consistent across batches; quality_ok rate ~90%.
  # CHANGE IF: too many quality retries → lower to 0.4; too repetitive → raise to 0.5.

  max_retries: 3

quality:
  min_words: 8
  max_words: 80
  require_stop_condition: true

  require_landmark: false
  # require_landmark=false: consistent with v272 baseline. The key difference
  # in v277 quality is temperature-driven variety, not stricter checks.

workers: 8

# ── Key differentiator vs v272 ────────────────────────────────────────────────
# The v277 ChronoNav dataset has 28 more mods (212 vs 184), all confirmed 3-run
# wins. These are turn-direction fixes. The annotator's 0.45 temperature for
# Gate3 captures directional variety better than 0.4, complementing those fixes.
# For val_seen and train, this produces better turn-direction cues in instructions.

output:
  base_dir: "outputs/annotated_datasets_top5"

  val_unseen:
    # VLM-annotated val_unseen: full Gate1-4 pipeline, VLM instruction primary.
    # ChronoNav backup saved as unseen_v277_chrono.json.gz.
    source_dataset: "/mnt/nvme0/vln_habitat/habitat_data/datasets/vln/mp3d/r2r/v1/val_unseen/val_unseen.json.gz"
    frames_dir: "outputs/rendered_frames"
    metadata_dir: "outputs/annotated_datasets_top5/unseen_v277_meta"
    dataset_out: "outputs/annotated_datasets_top5/unseen_v277.json.gz"
    vlm_instruction_primary: true

  val_seen:
    source_dataset: "/mnt/nvme0/vln_habitat/habitat_data/datasets/vln/mp3d/r2r/v1/val_seen/val_seen.json.gz"
    metadata_dir: "outputs/annotated_datasets_top5/seen_v277_meta"
    dataset_out: "outputs/annotated_datasets_top5/seen_v277.json.gz"
    frames_dir: "outputs/rendered_frames_val_seen"

  train:
    source_dataset: "/mnt/nvme0/vln_habitat/habitat_data/datasets/vln/mp3d/r2r/v1/train/train.json.gz"
    metadata_dir: "outputs/annotated_datasets_top5/train_v277_meta"
    dataset_out: "outputs/annotated_datasets_top5/train_v277.json.gz"
    frames_dir: "outputs/rendered_frames_train"
    status: "PENDING"
