# VLM Prompt Templates — edit here to tune instruction style without changing code

landmark_detection: |
  You are helping generate navigation instructions for an indoor robot.

  Look at this image from a navigation path and identify:
  1. ROOM TYPE: What kind of room or space is this? (bedroom, living room, kitchen, hallway, dining room, bathroom, staircase, laboratory, etc.)
  2. LANDMARKS: Name up to 4 prominent objects or features that could serve as navigation landmarks. Focus on: furniture, doorways, rugs, stairs, counters, columns, appliances, distinctive decor.
  3. PATH DIRECTION: Is the navigable path going mostly straight-ahead, or is there a visible turn?

  Respond ONLY in this exact format (one line each):
  ROOM: <room_type>
  LANDMARKS: <item1>, <item2>, <item3>
  DIRECTION: <straight | left | right | unclear>

instruction_generation: |
  You are a navigation instruction writer for the R2R (Room-to-Room) Vision-Language Navigation dataset.

  Your task: write a concise, natural navigation instruction for a human or robot to follow the path described below.

  PATH DESCRIPTION (motion sequence):
  {motion_sequence}

  SCENE CONTEXT (what is visible at key points):
  {scene_context}

  REQUIREMENTS:
  - Write 1-4 short sentences, total 15-40 words
  - Reference specific visible landmarks (furniture, rooms, doorways, rugs, etc.)
  - Use natural turn language: "turn left", "make a left", "go left at"
  - MUST include a stop condition: "stop at/near/by [landmark]" or "wait at [landmark]"
  - Do NOT mention specific distances in meters or numbers
  - Write as if giving directions to a person walking through the space

  GT STYLE EXAMPLES (do NOT copy — use only as style reference):
  - "Exit the bedroom, turn left, and walk past the gray couch. Stop near the rug."
  - "Walk through the kitchen doorway, turn right at the dining table, and stop in the hallway."
  - "Go up the stairs. Turn around and go through the door. Stop in front of the bedroom closet."
  - "Walk across the room and wait at the far end of the bar."

  Write ONLY the instruction text, nothing else:

instruction_generation_text_only: |
  You are a navigation instruction writer for the R2R (Room-to-Room) Vision-Language Navigation dataset.

  Your task: write a concise, natural navigation instruction based ONLY on the path geometry below.
  You cannot see the images, so use generic but plausible indoor navigation language.

  PATH DESCRIPTION (motion sequence):
  {motion_sequence}

  REQUIREMENTS:
  - Write 1-4 short sentences, total 15-40 words
  - Reference plausible indoor landmarks for the room types implied by the path
  - MUST include a stop condition: "stop at", "wait", etc.
  - Match the style of GT R2R instructions (concise, direct, landmark-referenced)

  GT STYLE EXAMPLES:
  - "Exit the bedroom, turn left, and walk past the couch. Stop near the rug."
  - "Walk down the hallway and turn right at the doorway. Stop at the end of the corridor."
  - "Go straight through the living room. Stop at the far end near the window."

  Write ONLY the instruction text, nothing else:

instruction_generation_gate3: |
  You are a navigation instruction writer for the R2R (Room-to-Room) VLN dataset.

  Write a concise, natural navigation instruction for the path below.
  Match the style of real R2R human instructions: landmark-focused, room-transition-based, minimal explicit turn commands.

  PATH:
  {motion_sequence}

  RULES:
  - 1-4 sentences, 12-40 words total
  - Use room transitions ("walk into the kitchen", "go through the doorway") instead of "turn left/right" whenever possible
  - Mention at most 2 specific landmarks as navigation waypoints
  - If given an Initial facing direction, START the instruction with that action (e.g., "Turn left and...")
  - MUST include a stop condition: "stop", "wait", "halt", or "stand" near the goal landmark
  - Do NOT list every turn — compress minor turns into room-transition phrases

  STYLE REFERENCE (do NOT copy — style only):
  - "Exit the bedroom and turn left. Walk past the gray couch and stop near the rug."
  - "Walk up the stairs. Follow the hallway and go through the door. Stop at the window."
  - "Go straight through the living room and past the pool. Stop at the far corner of the bar."
  - "Walk into the kitchen through the doorway. Stop near the island at the far end."
  - "Turn right at the top of the stairs. Walk toward the closet and stop at the small window."

  Write ONLY the instruction text:

instruction_generation_gate3_v7: |
  You are a navigation instruction writer for the R2R (Room-to-Room) VLN dataset.

  Write a navigation instruction for the path below.
  The PATH includes a "Target_sentences" field — write EXACTLY that many sentences.

  PATH:
  {motion_sequence}

  RULES:
  - Write EXACTLY the number of sentences specified in Target_sentences
  - START with the Initial facing action if given (e.g., "Turn left and..." / "Turn around and...")
  - If Waypoint 1 says "turn left/right at X": include "turn left/right at the X" in sentence 1 or 2
  - If Waypoint 2 exists: include it in a separate sentence
  - Use "exit the ROOM" when the path starts from a named room (bedroom, kitchen, etc.)
  - Use "walk down/up the stairs" when the path includes stairs (shown in Distance)
  - Do NOT use "continue" more than once; use "walk through", "head into", "go past", "go through" instead
  - Use "make a right/left" or "turn right/left" interchangeably for variety
  - MUST include the Stop phrase exactly as written in the Stop field
  - Keep instructions between 12-40 words total

  STYLE REFERENCE (do NOT copy — use only for style):
  1-sentence: "Walk across the room and wait at the far end of the bar."
  2-sentence: "Turn left and walk up the stairs. Follow the hallway and stop at the small window."
  3-sentence: "Exit the living room and turn right. Walk past the gray sofa and enter the kitchen. Stop near the counter."
  4-sentence: "Turn right and walk down the hallway. Go past the glass table. Turn left through the doorway into the bedroom. Wait near the bed."

  Write ONLY the instruction text:

# Quality requirements (used by quality_filter.py)
quality:
  min_words: 10
  max_words: 60
  max_retries: 3
  require_stop_condition: true
  stop_words: [stop, wait, halt, stand, pause]
  require_landmark: true
  # BERTScore target (Gate 7 evaluation)
  bertscore_target: 0.85
  bleu4_target: 0.15
