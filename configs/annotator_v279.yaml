# =============================================================================
# Annotator Config v279 — "GT-Style Diversity"
# Target: Fix "Go straight" first-word bias (v278: 96% → target <40%)
# Key changes from v278:
#   Gate3: Navigation-perspective prompt, force explicit room type always
#   Gate4: Varied first-word requirement + GT-style examples, landmark@turn
#   gate3.temperature: 0.4 → 0.5 (more varied scene descriptions)
#   gate4.temperature: 0.35 → 0.45 (more lexical diversity)
#   gate4.max_tokens: 140 → 150 (budget for richer instructions)
#   quality: adds go_straight_bias check to enforce first-word diversity
# =============================================================================

version: "3.2-diversity-v279"

vllm:
  base_url: "http://10.77.32.231:8000/v1"
  model: "cyankiwi/gemma-4-31B-it-AWQ-4bit"
  api_key: "token-abc123"

gate3:
  max_tokens: 150
  temperature: 0.5
  # temperature raised 0.4→0.5: more varied scene descriptions.
  # Navigation-perspective prompt forces explicit room type even if uncertain.

gate4:
  max_tokens: 150
  temperature: 0.45
  # temperature raised 0.35→0.45: enforces lexical diversity in sentence starters.
  # New prompt includes few-shot examples + explicit "VARY the first word" instruction.
  max_retries: 6
  # max_retries=6: extra retry budget for first-word diversity check.

# ── Quality Filter ────────────────────────────────────────────────────────────
quality:
  min_words: 12
  max_words: 70
  require_stop_condition: true
  require_landmark: true
  # NEW in v279: go_straight_bias=true → adds quality check that rejects
  # instructions starting with "go straight" (forces retry with higher temp)
  reject_go_straight: true

workers: 8

output:
  base_dir: "outputs/annotated_datasets_top5"

  val_unseen:
    source_dataset: "/mnt/nvme0/vln_habitat/habitat_data/datasets/vln/mp3d/r2r/v1/val_unseen/val_unseen.json.gz"
    frames_dir: "outputs/rendered_frames"
    metadata_dir: "outputs/annotated_datasets_top5/unseen_v279_meta"
    dataset_out: "outputs/annotated_datasets_top5/unseen_v279.json.gz"
    vlm_instruction_primary: true

  val_seen:
    source_dataset: "/mnt/nvme0/vln_habitat/habitat_data/datasets/vln/mp3d/r2r/v1/val_seen/val_seen.json.gz"
    metadata_dir: "outputs/annotated_datasets_top5/seen_v279_meta"
    dataset_out: "outputs/annotated_datasets_top5/seen_v279.json.gz"
    frames_dir: "outputs/rendered_frames_val_seen"

  train:
    source_dataset: "/mnt/nvme0/vln_habitat/habitat_data/datasets/vln/mp3d/r2r/v1/train/train.json.gz"
    metadata_dir: "outputs/annotated_datasets_top5/train_v279_meta"
    dataset_out: "outputs/annotated_datasets_top5/train_v279.json.gz"
    frames_dir: "outputs/rendered_frames_train"
    status: "PENDING"
