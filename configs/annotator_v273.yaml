# =============================================================================
# Annotator Config v273 — "Tighter Quality" style
# Corresponding eval result: SR=65.15% (329/505 eps) on val_unseen — #4 best
# Strategy: ChronoNav val_unseen (188 mods) + VLM-annotated seen/train
# =============================================================================
# Note: v273 uses stricter quality thresholds than v272 — slightly higher
# rejection rate but cleaner instructions. Evaluation showed marginal gain.
# =============================================================================

version: "3.0-v273"

vllm:
  base_url: "http://10.77.32.231:8000/v1"
  model: "cyankiwi/gemma-4-31B-it-AWQ-4bit"
  api_key: "token-abc123"

gate3:
  max_tokens: 120
  temperature: 0.35
  # temperature (v273 = 0.35 — conservative):
  # Slightly below v272's 0.4. Produces more consistent scene descriptions.
  # EFFECT: landmark names are more predictable/precise (e.g., "wooden table"
  # vs just "table"). Less hallucination of rooms/objects.
  # CHANGE IF: descriptions too repetitive across similar scenes → raise to 0.4.

gate4:
  max_tokens: 130
  # max_tokens=130 (vs 120): allows slightly longer stop conditions.
  # CHANGE IF: instructions are cut off mid-sentence → raise to 150.

  temperature: 0.3
  # temperature (v273 gate4 = 0.3 — most conservative):
  # Very consistent, precise phrasing. Produces cleaner stop conditions.
  # TRADEOFF: may generate very similar-sounding instructions for different paths.
  # CHANGE IF: too many duplicate-sounding instructions → raise to 0.4.

  max_retries: 4
  # max_retries=4 (vs 3): extra retry to improve quality_ok rate.
  # Each retry: temperature 0.3 → 0.4 → 0.5 → 0.6.

quality:
  min_words: 10
  # min_words=10 (stricter than v272=8):
  # EFFECT: forces more complete instructions. Rejects "Go left, stop." type outputs.
  # TRADEOFF: ~10% higher rejection rate → more retries needed.
  # CHANGE IF: processing very slow due to retries → lower to 8.

  max_words: 70
  # max_words=70 (tighter upper bound than v272=80):
  # Prevents verbose instructions that confuse the robot.

  require_stop_condition: true
  require_landmark: false

workers: 8

output:
  base_dir: "outputs/annotated_datasets_top5"

  val_unseen:
    # VLM-annotated val_unseen: full Gate1-4 pipeline, VLM instruction primary.
    # ChronoNav backup saved as unseen_v273_chrono.json.gz.
    source_dataset: "/mnt/nvme0/vln_habitat/habitat_data/datasets/vln/mp3d/r2r/v1/val_unseen/val_unseen.json.gz"
    frames_dir: "outputs/rendered_frames"
    metadata_dir: "outputs/annotated_datasets_top5/unseen_v273_meta"
    dataset_out: "outputs/annotated_datasets_top5/unseen_v273.json.gz"
    vlm_instruction_primary: true

  val_seen:
    source_dataset: "/mnt/nvme0/vln_habitat/habitat_data/datasets/vln/mp3d/r2r/v1/val_seen/val_seen.json.gz"
    metadata_dir: "outputs/annotated_datasets_top5/seen_v273_meta"
    dataset_out: "outputs/annotated_datasets_top5/seen_v273.json.gz"
    frames_dir: "outputs/rendered_frames_val_seen"

  train:
    source_dataset: "/mnt/nvme0/vln_habitat/habitat_data/datasets/vln/mp3d/r2r/v1/train/train.json.gz"
    metadata_dir: "outputs/annotated_datasets_top5/train_v273_meta"
    dataset_out: "outputs/annotated_datasets_top5/train_v273.json.gz"
    frames_dir: "outputs/rendered_frames_train"
    status: "PENDING"
